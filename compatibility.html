{% extends "base.html" %}
{% block title %}Калькулятор совместимости{% endblock %}

{% block content %}
<div class="compatibility-container">
    <h1>Калькулятор совместимости</h1>
    <p class="subtitle">Введите даты рождения</p>

    <form method="POST" action="/compatibility" class="compatibility-form">
        <div class="input-group">
            <label for="person1">Ваша дата рождения:</label>
            <input type="date" name="person1" id="person1" required>
        </div>

        <div class="input-group">
            <label for="person2">Дата рождения партнёра:</label>
            <input type="date" name="person2" id="person2" required>
        </div>

        <button type="submit">Рассчитать совместимость</button>
    </form>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    {% if answer %}
    <div class="compatibility-result">
        <h2>Результат:</h2>
        <p class="result-text">
            {{ answer }}
        </p>
    </div>
    {% endif %}
</div>
{% endblock %}

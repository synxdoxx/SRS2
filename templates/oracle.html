{% extends "base.html" %}

{% block content %}
<div class="oracle-container">
    <h1>Онлайн Оракул</h1>
    <p class="subtitle">Задай свой вопрос и получи ответ от древнего оракула</p>

    <form method="POST" action="/oracle" class="oracle-form">
        <input type="text" name="question" placeholder="Введи свой вопрос..." required>
        <button type="submit">Узнать ответ</button>
    </form>

    {% if error %}
    <div class="error-message">{{ error }}</div>
    {% endif %}

    {% if answer %}
    <div class="oracle-answer">
        <p class="question">Твой вопрос: <em>{{ question }}</em></p>
        <div class="answer-box">
            <p class="answer-text">{{ answer }}</p>
        </div>
    </div>
    {% endif %}
</div>
{% endblock %}
